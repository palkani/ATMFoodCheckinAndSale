<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Day Report</title><link rel="stylesheet" href="/style.css">
<style>h3{margin:22px 0 8px}td.n,th.n{text-align:right}@media print{nav,.noprint,.toast{display:none!important}body{background:#fff;color:#000}.panel,.stats div{border-color:#999}}</style></head><body>
<main>
  <div class="row noprint" style="margin-bottom:12px;align-items:center">
    <input type="date" id="d" style="max-width:200px"><button id="print" style="flex:0">🖨 Print</button>
    <a id="xl" style="flex:0"><button>⬇ Report (Excel)</button></a>
    <a href="/snack-sales.xlsx" style="flex:0"><button>⬇ Snack sheet</button></a>
    <a href="/sheet.xlsx" style="flex:0"><button>⬇ Lunch sheet</button></a>
  </div>
  <h2 id="title" style="margin:0 0 12px"></h2>
  <div class="stats" id="stats"></div>
  <div id="body"></div>
</main>
<script type="module">
import { $, api, money, esc, nav } from '/common.js';
nav('report');
$('#d').value = new Date().toLocaleDateString('en-CA');
const M = ['cash', 'zelle', 'card'];
const table = (head, rows, numFrom = 1) => `<div class="panel" style="overflow-x:auto;padding:4px 10px"><table><thead><tr>${head.map((h, i) => `<th class="${i >= numFrom ? 'n' : ''}">${h}</th>`).join('')}</tr></thead><tbody>${
  rows.length ? rows.map((r) => `<tr>${r.map((c, i) => `<td class="${i >= numFrom ? 'n' : ''}">${c}</td>`).join('')}</tr>`).join('') : `<tr><td colspan="${head.length}" style="color:var(--mute)">Nothing yet</td></tr>`}</tbody></table></div>`;
const sec = (t, html) => `<h3>${t}</h3>${html}`;
async function load() {
  const day = $('#d').value, r = await api('GET', '/api/report?date=' + day);
  $('#xl').href = '/report.xlsx?date=' + day;
  $('#title').textContent = 'Sales report — ' + new Date(day + 'T12:00').toLocaleDateString([], { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });
  const t = r.total;
  $('#stats').innerHTML = [['Total sales', t.all], ['Cash', t.cash], ['Zelle', t.zelle], ['Card', t.card]].map(([l, v]) => `<div>${l}<b>${money(v)}</b></div>`).join('');
  const kinds = [['🍪 Snack sales', r.byKind.snack], ['🛒 Walk-up lunch', r.byKind.lunch], ['<b>All</b>', t]];
  let h = sec('Sales by type and payment method', table(['Type', 'Cash', 'Zelle', 'Card', 'Total', 'Txns'], kinds.map(([n, k]) => [n, ...M.map((m) => money(k[m])), money(k.all), k.count])));
  h += sec('Sales by seller', table(['Seller', 'Snacks', 'Walk-up lunch', 'Total', 'Txns'], r.byUser.map((u) => [esc(u.user), money(u.snack), money(u.lunch), '<b>' + money(u.amount) + '</b>', u.count])));
  h += sec('Items sold', table(['Item', 'Qty', 'Cash qty', 'Zelle qty', 'Card qty', 'Revenue'], r.items.map((i) => [(i.kind === 'lunch' ? '🛒 ' : '🍪 ') + esc(i.name), i.qty, i.cash, i.zelle, i.card, money(i.revenue)])));
  h += sec('Sales by hour', table(['Hour', 'Transactions', 'Amount'], r.hourly.map((x) => [new Date(2000, 0, 1, x.hour).toLocaleTimeString([], { hour: 'numeric' }), x.count, money(x.amount)])));
  h += sec('Lunches served (preorder pickups + walk-ups)', table(['Lunch', 'Preorder picked up', 'Walk-up sold', 'Total'], r.lunches.map((l) => [esc(l.label), l.preorder, l.walkup, '<b>' + l.total + '</b>'])));
  const p = r.preorders;
  if (p.loaded) {
    h += sec(`Preorders — ${p.checkedIn} of ${p.orders} orders checked in (prepaid ${money(p.prepaid * 100)}, picked up ${money(p.prepaidPicked * 100)})`,
      table(['Lunch', 'Ordered', 'Picked up', 'Remaining'], p.items.map((i) => [esc(i.label), i.ordered, i.pickedUp, i.ordered - i.pickedUp])) + '<div style="height:10px"></div>' +
      table(['Serving time', 'Orders', 'Checked in', 'Lunches', 'Lunches picked up'], p.slots.map((s) => [esc(s.slot), s.orders, s.checkedIn, s.lunches, s.lunchesPicked])));
  } else h += sec('Preorders', '<p style="color:var(--mute)">No preorder sheet loaded.</p>');
  h += sec('All transactions', table(['#', 'Time', 'Type', 'Details', 'Payment', 'By', 'Amount'], r.rows.slice().reverse().map((x) => [x.id,
    new Date(x.created_at.replace(' ', 'T') + 'Z').toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' }), x.kind === 'lunch' ? 'Walk-up lunch' : 'Snack', esc(x.description), x.method, x.sold_by === 'admin' ? 'Admin' : 'Rep', money(x.total_cents)]), 6));
  $('#body').innerHTML = h;
}
$('#d').onchange = load; $('#print').onclick = () => print();
load();
</script></body></html>
